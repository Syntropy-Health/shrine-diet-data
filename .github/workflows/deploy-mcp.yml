# Deploy KG MCP gateway to Railway
#
# Mirrors apps/Syntropy-Journals deployment pattern.
# Branch → Environment:
#   main  → test  (until the kg-mcp Railway service exists in the prod env;
#                  flip back to prod once that's provisioned)
#   test  → test
#   dev-* → test
#   workflow_dispatch → user choice (prod still selectable manually)
#
# Required secrets (per environment):
#   RAILWAY_TOKEN — project-scoped Railway deployment token
# Required repo secrets:
#   NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD — Aura connection (set in Railway dashboard, NOT here)
#   OPENROUTER_API_KEY — for embedder + LLM (set in Railway dashboard)
#   ZILLIZ_URI, ZILLIZ_TOKEN — Milvus vector store (set in Railway dashboard;
#     mirrored from Infisical /mcp/kg/; required when KG_VECTOR_BACKEND=milvus)
#   KG_VECTOR_BACKEND — "nano" (default) | "milvus" — selects the vector backend
# Required Railway service:
#   kg-mcp — single combined service (scoped_server + MCP gateway)

name: Deploy KG MCP Gateway

on:
  push:
    branches:
      - main
      - test
      - "dev-*"
    paths:
      - "Dockerfile"
      - "railway.toml"
      - "shrine-diet-bioactivity/lightrag/**"
      - "mcp/**"
      - "scripts/start_combined.sh"
      - ".github/workflows/deploy-mcp.yml"
  pull_request:
    branches:
      - main
      - test
    paths:
      - "Dockerfile"
      - "railway.toml"
      - "shrine-diet-bioactivity/lightrag/**"
      - "mcp/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - prod

concurrency:
  group: deploy-mcp-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  RAILWAY_SERVICE: "kg-mcp"

jobs:
  # =========================================================================
  # Detect environment from branch
  # =========================================================================
  detect-environment:
    name: Detect Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect.outputs.environment }}
      is_prod: ${{ steps.detect.outputs.is_prod }}
    steps:
      - name: Detect from branch
        id: detect
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_DISPATCH_ENV: ${{ github.event.inputs.environment }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            ENV="$GH_DISPATCH_ENV"
          elif [ "$GH_REF" = "refs/heads/main" ]; then
            # Until kg-mcp exists in the prod Railway env, route main→test.
            # workflow_dispatch can still pick prod explicitly.
            ENV="test"
          elif [ "$GH_REF" = "refs/heads/test" ]; then
            ENV="test"
          elif [[ "$GH_REF" == refs/heads/dev-* ]]; then
            ENV="test"
          else
            ENV="test"
          fi
          if [ "$ENV" = "prod" ] && [ "$GH_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::prod deploys are only allowed via workflow_dispatch (got event=$GH_EVENT_NAME, ref=$GH_REF)"
            exit 1
          fi
          IS_PROD="false"
          [ "$ENV" = "prod" ] && IS_PROD="true"
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "is_prod=$IS_PROD" >> $GITHUB_OUTPUT

  # =========================================================================
  # Unit tests — MCP gateway (89% coverage already)
  # =========================================================================
  test-mcp:
    name: MCP Gateway Tests
    runs-on: ubuntu-latest
    needs: detect-environment
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # mcp-opennutrition upstream rebased; we vendor what we need

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install MCP package + test deps
        working-directory: ./mcp
        run: pip install -e '.[test]'

      - name: Run tests with coverage
        working-directory: ./mcp
        run: pytest tests/ --cov=src/kg_mcp --cov-report=term --cov-fail-under=80

  # =========================================================================
  # Docker build smoke (catches Dockerfile issues before deploying)
  # =========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [detect-environment, test-mcp]
    if: github.event_name != 'pull_request' || github.base_ref == 'test'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # mcp-opennutrition upstream rebased; we vendor what we need

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kg-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — image launches and reports a sane Python version
        run: |
          docker run --rm --entrypoint python kg-mcp:${{ github.sha }} -c "
          import sys
          assert sys.version_info[:2] == (3, 11), f'wrong python: {sys.version}'
          import kg_mcp
          import kg_mcp.server  # must import without booting the server
          print('image ok, python', sys.version)
          "

  # =========================================================================
  # Deploy
  # =========================================================================
  deploy:
    name: Deploy to Railway (${{ needs.detect-environment.outputs.environment }})
    if: github.event_name != 'pull_request' && needs.docker-build.result == 'success'
    runs-on: ubuntu-latest
    needs: [detect-environment, docker-build]
    environment:
      name: ${{ needs.detect-environment.outputs.environment }}
    # `secrets` context is NOT allowed in a step-level `if:` (it is a startup
    # validation error — the whole workflow fails to compile, producing a run
    # with zero jobs). Promote the existence check to a job-level env, which MAY
    # reference secrets, then gate the Braintrust step on `env.HAS_BRAINTRUST`.
    env:
      HAS_BRAINTRUST: ${{ secrets.BRAINTRUST_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify RAILWAY_TOKEN present
        env:
          HAS_RAILWAY: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          if [ "$HAS_RAILWAY" != "true" ]; then
            echo "::error::RAILWAY_TOKEN not set in environment '${{ needs.detect-environment.outputs.environment }}'"
            exit 1
          fi

      - name: Install Railway CLI
        # Pinned to the MAJOR the JSON shape was measured against (5.13.2,
        # 2026-08-27). railway_deployment.py parses `deployment list --json`;
        # pinning the parser to a measured shape while letting the producer
        # float on @latest leaves the two free to diverge silently.
        run: npm install -g @railway/cli@5

      - name: Sync Braintrust env to Railway service
        # Push BRAINTRUST_API_KEY + BRAINTRUST_PROJECT to the Railway service
        # before deploy so the kg-mcp runtime tracing helper picks them up.
        # Skipped cleanly when the GH secret is empty (fork PRs, or before
        # the secret is mirrored). When set, this keeps Railway and Infisical
        # from drifting apart — the GH secret is the deploy-time cache.
        # The API key is piped via `--set-from-stdin` so the value never
        # passes through shell expansion — safer against rotation to a key
        # format that contains $ / backtick / newline. BRAINTRUST_PROJECT
        # is a static literal and uses the simpler `--set` form.
        if: ${{ env.HAS_BRAINTRUST == 'true' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
        run: |
          printf '%s' "$BRAINTRUST_API_KEY" | railway variables \
            --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" \
            --set-from-stdin BRAINTRUST_API_KEY --skip-deploys
          railway variables --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" \
            --set "BRAINTRUST_PROJECT=shrine-diet-bioactivity" --skip-deploys

      # Record which deployment is live BEFORE deploying. `railway up --detach`
      # returns before the new deployment registers, so without this the
      # "newest" deployment can still be the PREVIOUS one, carrying its own real
      # SUCCESS. Comparing ids is what makes the status check mean anything.
      # Record which deployment is live BEFORE deploying. `railway up --detach`
      # returns before the new one registers, so without this the "newest"
      # deployment can still be the PREVIOUS one carrying its own real SUCCESS.
      # FAILS CLOSED: if we cannot read the current id we refuse to deploy
      # blind. An empty prev disables the identity comparison entirely, which
      # is exactly how the 2026-06-29 false-green worked.
      - name: Capture current deployment id
        id: prev_deploy
        timeout-minutes: 3
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
        run: |
          set -o pipefail
          RAW=$(railway deployment list --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" --limit 20 --json) || {
            echo "::error::railway deployment list failed — refusing to deploy without a baseline id"
            exit 1
          }
          PREV=$(printf '%s' "$RAW" | python3 scripts/ci/railway_deployment.py newest-id) || {
            echo "::error::could not read the current deployment id: $PREV"
            exit 1
          }
          PREV=${PREV//[$'\n\r']/}
          if [ -z "$PREV" ]; then
            echo "::error::empty baseline deployment id — refusing to deploy blind"
            exit 1
          fi
          echo "prev_id=$PREV" >> "$GITHUB_OUTPUT"
          echo "baseline deployment: $PREV"

      - name: Deploy
        timeout-minutes: 15
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
        run: |
          railway up --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" --ci --detach

      # THE VERDICT — about the DEPLOYMENT, not the domain.
      # Until 2026-08-27 the verdict came from polling https://$DOMAIN/health,
      # which the LAST HEALTHY container answers when a new one crashes at boot.
      # See scripts/ci/railway_deployment.py for the full history.
      #
      # Exit 1 (deployment terminally bad) and exit 4 (we could not read) are
      # handled SEPARATELY and deliberately: only 1 authorises the destructive
      # rollback. Treating "cannot tell" as "is bad" is how a transient API blip
      # becomes `railway down` against a healthy container.
      - name: Wait for deployment to reach a terminal state
        id: deploy_status
        timeout-minutes: 16
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
          PREV_ID: ${{ steps.prev_deploy.outputs.prev_id }}
          POLL_BUDGET_SECONDS: "780"
          MAX_CONSECUTIVE_UNREADABLE: "3"
        run: |
          set -o pipefail
          if [ -z "$PREV_ID" ]; then
            echo "::error::PREV_ID is empty — the capture step did not wire through; refusing to judge"
            exit 1
          fi
          DEADLINE=$(( $(date +%s) + POLL_BUDGET_SECONDS ))
          UNREADABLE=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RAW=$(railway deployment list --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" --limit 20 --json 2>&1) || RAW=""
            set +e
            VERDICT=$(printf '%s' "$RAW" | python3 scripts/ci/railway_deployment.py assert "$PREV_ID")
            RC=$?
            set -e
            case "$RC" in
              0)
                echo "deployment advanced and succeeded: $VERDICT"
                echo "verdict=success" >> "$GITHUB_OUTPUT"
                echo "deployment=${VERDICT//[$'\n\r']/}" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              1)
                echo "::error::deployment FAILED: $VERDICT"
                echo "verdict=crashed" >> "$GITHUB_OUTPUT"
                echo "deployment=${VERDICT//[$'\n\r']/}" >> "$GITHUB_OUTPUT"
                exit 1 ;;
              3)
                UNREADABLE=0
                echo "  waiting: $VERDICT"
                sleep 10 ;;
              4)
                UNREADABLE=$((UNREADABLE + 1))
                echo "::warning::unreadable poll ${UNREADABLE}/${MAX_CONSECUTIVE_UNREADABLE}: $VERDICT"
                if [ "$UNREADABLE" -ge "$MAX_CONSECUTIVE_UNREADABLE" ]; then
                  echo "::error::could not read deployment state ${UNREADABLE}x consecutively — NOT rolling back, state unknown"
                  echo "verdict=unreadable" >> "$GITHUB_OUTPUT"
                  exit 1
                fi
                sleep 10 ;;
              *)
                echo "::error::railway_deployment.py usage error (rc=$RC): $VERDICT"
                echo "verdict=unreadable" >> "$GITHUB_OUTPUT"
                exit 1 ;;
            esac
          done
          echo "::error::deployment did not reach a terminal state within ${POLL_BUDGET_SECONDS}s"
          echo "verdict=timeout" >> "$GITHUB_OUTPUT"
          exit 1


      # SECONDARY probe only. This step can NEVER again be the deploy verdict:
      # it polls the service DOMAIN, which the previous container answers when a
      # new one crashes. Kept because an unreachable domain after a SUCCESSFUL
      # deployment is still worth failing on — but it now runs AFTER the
      # deployment verdict has already decided whether anything shipped.
      - name: Resolve service URL + wait for /health (secondary)
        id: health_check
        timeout-minutes: 8
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
        run: |
          # Resolve domain via `railway status --json` with a fallback to the
          # known `${SERVICE}-${ENV}.up.railway.app` pattern. The fallback
          # exists because the CLI's JSON shape has drifted across versions
          # and fresh services briefly report an empty serviceDomains array.
          # See scripts/ci/resolve_railway_domain.sh + its unit tests.
          STATUS=$(railway status --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" --json 2>/dev/null || echo '{}')
          DOMAIN=$(printf '%s' "$STATUS" | scripts/ci/resolve_railway_domain.sh "${{ env.RAILWAY_SERVICE }}" "$ENV_NAME")
          if [ -z "$DOMAIN" ]; then
            echo "::error::resolve_railway_domain.sh returned empty — service '${{ env.RAILWAY_SERVICE }}' env '$ENV_NAME'"
            exit 1
          fi
          URL="https://$DOMAIN/health"
          echo "Polling $URL..."
          for i in $(seq 1 60); do
            if curl -fsS -m 5 "$URL" >/dev/null 2>&1; then
              echo "✅ healthy after ${i}*5=$((i*5))s"
              echo "url=https://$DOMAIN" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check did not pass within 5 minutes"
          exit 1

      # `railway down` DELETES the most recent deployment. It must fire ONLY on
      # positive evidence that the new deployment is terminally bad.
      #
      # Two ways to get this wrong, both of which take a healthy service down:
      #   - firing on "we could not read the state" (verdict=unreadable): the
      #     state is UNKNOWN, and a transient API blip would delete a good
      #     container — the gate causing the outage it exists to prevent.
      #   - firing on the poll timeout (verdict=timeout): if the new deployment
      #     never registered, the most recent deployment IS the previous good
      #     one, so the rollback deletes exactly what it meant to protect.
      #
      # So this gates on verdict == 'crashed' only. Before 2026-08-27 the step
      # was keyed to `steps.health_check.outcome == 'failure'` with no status
      # function, which GitHub implicitly ANDs with success() — it was doubly
      # disabled and could never run at all.
      - name: Rollback on a confirmed bad deployment
        if: always() && steps.deploy_status.outputs.verdict == 'crashed'
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
          DEPLOYMENT: ${{ steps.deploy_status.outputs.deployment }}
        run: |
          echo "::warning::confirmed bad deployment ($DEPLOYMENT) — removing it"
          railway down --service "${{ env.RAILWAY_SERVICE }}" --environment "$ENV_NAME" --yes

      - name: Deployment summary
        if: always()
        # Values reach bash through env:, NOT by ${{ }} interpolation into the
        # run: body. The domain is attacker-influenceable (it comes from
        # `railway status --json` -> resolve_railway_domain.sh with no charset
        # validation), and ${{ }} is substituted BEFORE bash parses the line, so
        # a metacharacter in it would break out of the quotes and execute on a
        # runner holding a credentialed checkout.
        env:
          ENV_NAME: ${{ needs.detect-environment.outputs.environment }}
          HEALTH_URL: ${{ steps.health_check.outputs.url }}
          HEALTH_OUTCOME: ${{ steps.health_check.outcome }}
          DEPLOY_VERDICT: ${{ steps.deploy_status.outputs.verdict }}
          DEPLOYMENT: ${{ steps.deploy_status.outputs.deployment }}
        run: |
          ENV="$ENV_NAME"
          URL="$HEALTH_URL"
          echo "## Deployment summary" >> $GITHUB_STEP_SUMMARY
          echo "Environment: \`$ENV\`" >> $GITHUB_STEP_SUMMARY
          echo "Service: \`${{ env.RAILWAY_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Deployment: \`${DEPLOYMENT:-<none>}\`" >> $GITHUB_STEP_SUMMARY
          echo "Deploy verdict: \`${DEPLOY_VERDICT:-<none>}\` (authoritative)" >> $GITHUB_STEP_SUMMARY
          echo "Health (secondary): \`$HEALTH_OUTCOME\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$URL" ]; then
            echo "URL: $URL" >> $GITHUB_STEP_SUMMARY
          fi
